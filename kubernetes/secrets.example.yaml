# Template only. Never applied by CI (.github/workflows/deploy.yml only applies
# kubernetes/app.yaml) and never committed with real values — that's what caused
# the live APP_KEY to silently drift from git in the first place.
#
# Bootstrap or rotate by copying this file, filling in real values, and applying
# by hand — the same out-of-band pattern already used for trip-planner-google-secret
# below:
#
#   cp kubernetes/secrets.example.yaml /tmp/secrets.yaml
#   $EDITOR /tmp/secrets.yaml   # replace the CHANGE_ME placeholders
#   kubectl apply -n default -f /tmp/secrets.yaml
#   rm /tmp/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: trip-planner-postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
---
# Currently unused: the Deployment in app.yaml sets APP_KEY as a literal env value
# instead of referencing this Secret (see the comment there). Kept as a template in
# case that changes back to a secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: laravel-secret
type: Opaque
stringData:
  APP_KEY: CHANGE_ME_APP_KEY
---
# trip-planner-google-secret is intentionally not defined here either — it's created
# directly in the cluster so the real credentials never enter git at all:
#
#   kubectl create secret generic trip-planner-google-secret \
#     --from-literal=GOOGLE_CLIENT_ID=<client-id> \
#     --from-literal=GOOGLE_CLIENT_SECRET=<client-secret>
