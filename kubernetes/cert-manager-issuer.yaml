# Requires cert-manager itself to be installed cluster-wide (not part of this app,
# and not namespaced — install once per cluster):
#
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#
# Then apply this file once: kubectl apply -f kubernetes/cert-manager-issuer.yaml
#
# Uses the HTTP-01 challenge via the existing Traefik ingress, so port 80 on
# trip-planner.szanto-zoltan.com must stay reachable from the internet for
# issuance and renewal.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mrbig00@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
