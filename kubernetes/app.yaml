# This file is applied by CI on every deploy (.github/workflows/deploy.yml) and holds
# no Secrets — those live in kubernetes/secrets.example.yaml, which is a template only,
# applied by hand, so CI can never overwrite a live credential with a stale git value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-planner-postgres-config
data:
  POSTGRES_DB: trip_planner
  POSTGRES_USER: trip_planner
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: trip-planner-postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: trip-planner-postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-planner-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - trip_planner
                - -d
                - trip_planner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - trip_planner
                - -d
                - trip_planner
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laravel-storage
  labels:
    app: trip-planner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Separate from laravel-storage on purpose: that volume also backs ephemeral
# framework cache/session/view data, while this holds irreplaceable
# user-uploaded trip documents — kept on its own claim so it can be resized
# and backed up independently. See App\Models\TripDocument /
# config/documents.php. RWO + a single replica, same as laravel-storage; a
# move to multiple replicas would need this on S3 instead (already wired as
# the "s3" disk in config/filesystems.php).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trip-documents-storage
  labels:
    app: trip-planner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-planner
  labels:
    app: trip-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-planner
  template:
    metadata:
      labels:
        app: trip-planner
    spec:
      # The laravel container runs as www-data (uid/gid 33 in the
      # serversideup/php-frankenphp base image — see production.Dockerfile).
      # fsGroup makes the kubelet chgrp every mounted volume (including a
      # freshly-provisioned trip-documents-storage PVC, which starts out
      # root-owned) to that group on mount, so www-data can write to it
      # without depending on the image doing its own chown at startup.
      # OnRootMismatch skips re-chowning on every restart once it's already
      # set, so this doesn't add a recursive chgrp pass on a growing volume.
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      # fsGroup only chgrp's each volume's own mount root — it doesn't cover
      # storage/app/private, which isn't a volume root itself, just a plain
      # directory inside laravel-storage's "app" subPath that happens to also
      # be the parent of the nested trip-documents-storage mount. Kubelet
      # auto-creates that parent (root:root 0755) the first time it sets up
      # the nested mount, and fsGroup's chgrp pass doesn't revisit it
      # afterwards — so www-data can't write livewire-tmp or anything else
      # under storage/app/private. This initContainer creates/fixes it as
      # root before the nested mount (and the laravel container) ever starts,
      # so kubelet finds it already correctly owned.
      initContainers:
        - name: fix-storage-private-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /storage/private
              chown -R 33:33 /storage/private
              chmod -R 2775 /storage/private
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: laravel-storage
              mountPath: /storage
              subPath: app
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
          args:
            - --redis.addr=redis://localhost:6379
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
        - name: laravel
          imagePullPolicy: Always
          image: ghcr.io/mrbig00/trip-planner:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          env:
            # Application
            - name: APP_NAME
              value: "Trip Planner"
            - name: APP_ENV
              value: production
            # Inline (not secretKeyRef) so rotating it doesn't depend on the unused
            # laravel-secret template in kubernetes/secrets.example.yaml.
            - name: APP_KEY
              value: base64:VjxPe7zpVHs6/vo0+QzMMD3rI/h49MMA9AVVK36xB+c=
            - name: APP_DEBUG
              value: "true"
            - name: APP_URL
              value: "https://trip-planner.szanto-zoltan.com"

            # Database
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: trip-planner-postgres-config
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: trip-planner-postgres-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-planner-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: AUTORUN_ENABLED
              value: "true"

            # OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: trip-planner-google-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trip-planner-google-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              value: "https://trip-planner.szanto-zoltan.com/auth/google/callback"

            # Analytics
            - name: GOOGLE_ANALYTICS_ID
              value: "G-R4ZFQ2X6RM"

            # Cache & Session
            - name: CACHE_STORE
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: database

            # Logging
            - name: LOG_CHANNEL
              value: stderr
            - name: LOG_LEVEL
              value: info

            # Broadcasting & Queue
            - name: BROADCAST_CONNECTION
              value: log

            # OpenTelemetry (zero-code auto-instrumentation -> Alloy -> Tempo/Grafana)
            - name: OTEL_PHP_AUTOLOAD_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: trip-planner
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PROPAGATORS
              value: baggage,tracecontext
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/html/storage/app
              subPath: app
            - name: laravel-storage
              mountPath: /var/www/html/storage/logs
              subPath: logs
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/cache
              subPath: framework/cache
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/sessions
              subPath: framework/sessions
            - name: laravel-storage
              mountPath: /var/www/html/storage/framework/views
              subPath: framework/views
            - name: trip-documents-storage
              mountPath: /var/www/html/storage/app/private/documents
      volumes:
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: laravel-storage
        - name: trip-documents-storage
          persistentVolumeClaim:
            claimName: trip-documents-storage
---
apiVersion: v1
kind: Service
metadata:
  name: trip-planner
  labels:
    app: trip-planner
spec:
  type: ClusterIP
  selector:
    app: trip-planner
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trip-planner-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trip-planner.szanto-zoltan.com
      secretName: trip-planner-tls
  rules:
    - host: trip-planner.szanto-zoltan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trip-planner
                port:
                  number: 80
