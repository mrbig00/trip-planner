server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Matches PHP's upload_max_filesize/post_max_size (Dockerfile) — nginx's
    # own 1M default would otherwise reject document uploads before PHP sees them.
    # Keep this equal to config('documents.infra_max_upload_kb') — see the
    # comment in Dockerfile next to upload_max_filesize.
    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
